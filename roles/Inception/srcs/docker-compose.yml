version: '3.7'

networks:
  my_network:
    driver: bridge

volumes:
  wordpress_volume:
    driver: local
    driver_opts:
       type: none
       device: /Users/bbrahim/Desktop/data/wordpress_volume
       o: bind
  database_volume:
    driver: local
    driver_opts:
       type: none
       device: /Users/bbrahim/Desktop/data/database_volume
       o: bind

services:
  ngnix:
    build: ./requirements/nginx
    image: nginx
    container_name: nginx
    restart: always
    depends_on:
     - wordpress
    env_file:
     - .env
    networks:
     - my_network
    ports:
     - "443:443"
     - "80:80"
    volumes:
     - wordpress_volume:/var/www/html

  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    restart: on-failure
    env_file:
     - .env
    networks:
     - my_network
    ports:
     - "3306:3306"
    volumes:
     - database_volume:/var/lib/mysql

  wordpress:
    build: ./requirements/wordpress
    image: wordpress
    container_name: wordpress
    restart: on-failure
    depends_on:
     - mariadb
    env_file:
     - .env
    networks:
     - my_network
    ports:
     - "9000:9000"
    volumes:
     - wordpress_volume:/var/www/html